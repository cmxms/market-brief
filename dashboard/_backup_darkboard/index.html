<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Brief Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Brief Live <span>— situational awareness</span></h1>
    <div class="stamp" id="stamp">connecting…</div>
  </header>

  <div id="alerts"></div>

  <div class="grid">
    <section class="panel wide">
      <h2>Regime <span class="sub" id="gex-sub"></span></h2>
      <div id="regime"></div>
    </section>

    <!-- left column stacks the short panels so none of them stretch to match
         Rotation's height (14 rows) and leave a dead empty box -->
    <div class="col">
      <section class="panel">
        <h2>Indices <span class="sub" id="idx-sub"></span></h2>
        <div class="tiles" id="indices"></div>
      </section>

      <section class="panel">
        <h2>Macro <span class="sub" id="macro-sub"></span></h2>
        <div class="tiles" id="macro"></div>
      </section>

      <section class="panel">
        <h2>Today</h2>
        <div id="events"></div>
      </section>
    </div>

    <section class="panel">
      <h2>Rotation <span class="sub" id="rot-sub">5d relative to SPY</span></h2>
      <div class="rot" id="rotation"></div>
    </section>

    <section class="panel wide">
      <h2>Signals</h2>
      <div class="reserved">
        <b>Reserved</b>
        Nothing here until a signal source earns it.
        The Signal Generator scored &minus;0.2R per signal over 175 emissions and is parked.
      </div>
    </section>
  </div>

  <div class="health" id="health"></div>

  <script src="/app.js"></script>
</body>
</html>
