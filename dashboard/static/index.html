<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brief Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Brief Live <span>— situational awareness</span></h1>
    <div class="stamp" id="stamp">connecting…</div>
  </header>

  <div id="alerts"></div>

  <div class="board">
    <!-- LEFT column -->
    <div class="col">
      <section class="panel" id="p-analysis">
        <div class="panel-head">
          <h2>AI Market Analysis</h2>
          <span class="sub" id="analysis-sub"></span>
        </div>
        <div class="panel-body" id="analysis"></div>
      </section>

      <section class="panel" id="p-calendar">
        <div class="panel-head">
          <h2>Economic Calendar</h2>
          <span class="sub">T1 + important</span>
        </div>
        <div class="panel-body" id="events"></div>
      </section>
    </div>

    <!-- CENTER column -->
    <section class="panel center" id="p-market">
      <div class="panel-head">
        <h2>Market</h2>
        <span class="sub" id="market-sub"></span>
      </div>
      <div class="panel-body">
        <div class="mkt-block">
          <h3>Indices <span class="sub" id="idx-sub"></span></h3>
          <div class="tiles" id="indices"></div>
        </div>
        <div class="mkt-block">
          <h3>Macro <span class="sub" id="macro-sub"></span></h3>
          <div class="tiles" id="macro"></div>
        </div>
        <div class="mkt-block">
          <h3>Fear &amp; Greed</h3>
          <div id="feargreed"></div>
        </div>
        <div class="mkt-block">
          <h3>Sector Rotation <span class="sub" id="rot-sub">5d rel to SPY</span></h3>
          <div class="rot" id="rotation"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT column -->
    <div class="col">
      <section class="panel" id="p-portfolio">
        <div class="panel-head">
          <h2>Portfolio Snapshot</h2>
          <span class="sub" id="portfolio-sub"></span>
        </div>
        <div class="panel-body" id="portfolio"></div>
      </section>

      <section class="panel" id="p-trades">
        <div class="panel-head">
          <h2>Recent Trades / Open Positions</h2>
          <span class="sub" id="trades-sub"></span>
        </div>
        <div class="panel-body" id="trades"></div>
      </section>
    </div>
  </div>

  <div class="health" id="health"></div>

  <script src="/app.js"></script>
</body>
</html>
