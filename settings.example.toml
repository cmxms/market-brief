# market-brief settings — every key is optional, these are the defaults.
#
# Copy to <runtime>/config/settings.toml and edit what you need. Missing file or
# missing key means the default below is used.

[model]
# Any model id your Hermes installation can reach.
name = "deepseek/deepseek-v4.1-flash-1017"
# Stop the writer if it has not finished after this many tool turns.
max_turns = 40
# Wall-clock ceiling for the compose step, in seconds.
run_budget_seconds = 900

[brief]
# Compose writes only to a fresh <runtime>/state/compose-attempts/attempt-*/
# directory (prompt.txt, brief.md, claims.json). The prompt supplies a unique
# end marker, placed after the disclaimer as the last thing in brief.md.
# claims.json must be an array of objects with nonempty string fields claim,
# source (HTTP(S) URL), retrieved (YYYY-MM-DD); [] is valid when none are needed.
# The parent checks the marker, ledger schema and brief validation, then writes
# complete.json (attempt, date, child_exit and artifact paths/SHA-256 hashes).
# Only then are those checked bytes promoted to briefs/<date>.md and
# <runtime>/state/claims-<date>.json. Mtimes are never completion evidence.
# A nonzero child exit is recoverable only for such a complete attempt; failed
# attempts remain for diagnosis. Timeout/launch failures never promote.
# Hard limit including the visible Run trace footer; the writer's prompt reserves
# room for that parent-added line. Validation rejects anything longer.
max_chars = 5200
# What the writer is told to aim for, so it lands under the ceiling in one pass
# instead of trimming with repeated edits (which burns the turn budget).
target_chars = 4800
# Brief used as the house-style reference in the compose prompt.
reference = "2026-07-14.md"

[limits]
# Refuse to run once the month's estimated spend would exceed this.
monthly_usd_cap = 2.0
# Cost estimate added to the running total for each run.
estimated_usd_per_run = 0.05

[discord]
# Channel for `--test` runs. Empty means test mode refuses to send.
test_channel_id = ""

[calendar]
# NYSE holiday calendar used to skip market holidays.
holidays_file = "market_holidays.yaml"

[runtime]
# The Hermes executable used for compose and test delivery.
hermes_bin = "hermes"
