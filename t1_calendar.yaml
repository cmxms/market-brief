# Authoritative T1 economic event calendar for MFFU compliance.
#
# MFFU's official T1 list (for NQ / equity index futures traders):
#   - FOMC Meeting (rate decision day)
#   - FOMC Minutes
#   - Employment Report (released as "Employment Situation" by BLS)
#   - CPI
# (EIA and Agricultural reports are T1 for energy/ag traders only.)
#
# Source verification:
#   FOMC dates: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   Empl Situation: https://www.bls.gov/schedule/news_release/empsit.htm
#                   + Schedule of Release Dates for Principal Federal Economic Indicators (whitehouse.gov)
#   CPI: https://www.bls.gov/schedule/news_release/cpi.htm
#
# Last updated: 2026-07-15 (re-verified — was 2026-05-25).
#   Re-verified 2026-07-15: FOMC meetings thru 2027-01 confirmed vs federalreserve.gov;
#   CPI Aug–Dec confirmed vs BLS mirrors (cpiinflationcalculator + usinflationcalculator) —
#   Nov-data CPI is 2026-12-10 (a "Dec 18" rumor was FALSE). Added Dec-data CPI 2027-01-13.
#   STILL ESTIMATED (BLS/FRED blocked automated fetch; consistent w/ rule, promote next pass):
#     - FOMC Minutes H2 2026 (3wk-post-meeting rule; Fed shows "not yet scheduled")
#     - Employment Situation Oct 2026 → Jan 2027 (first-Friday rule; Jan shifts to 2027-01-08).
# Re-verify quarterly. Events marked "estimated" must be confirmed against official source.
#
# Times are in America/New_York (ET) — the loader converts to UTC for the gate.
# FOMC rate decisions are at 14:00 ET; FOMC Minutes at 14:00 ET (Wed, 3 weeks post-meeting);
# Employment Situation + CPI at 08:30 ET.

