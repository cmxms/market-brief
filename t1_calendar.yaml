# Economic event calendar for the market brief.
#
# TWO TIERS — they answer different questions. Don't merge them.
#
#   events (T1)  = a prop firm's restricted-trading list. "T1" means you are
#                  BLOCKED FROM TRADING around it, not "it moves the market."
#                    - FOMC Meeting (rate decision day)
#                    - FOMC Minutes
#                    - Employment Report ("Employment Situation" at BLS)
#                    - CPI
#                  (EIA + Agricultural are T1 for energy/ag traders only.)
#
#   tier2        = NOT T1, but market-moving. These are the releases the brief
#                  needs and the T1 gate will never list: PCE, GDP, PPI, retail
#                  sales, jobless claims. Added 2026-07-30 after the T1 gate
#                  reported "no events today" on a morning that had GDP + PCE +
#                  claims all printing at 08:30.
#
# ---------------------------------------------------------------------------
# WHERE THE DATES COME FROM (verified 2026-07-30)
#
#   FRED  — https://api.stlouisfed.org/fred/release/dates?release_id=<id>
#           Needs FRED_API_KEY (already in this folder's .env). Returns SCHEDULED
#           FUTURE dates. Release IDs used here:
#             10 = CPI            50 = Employment Situation
#             53 = GDP            54 = Personal Income & Outlays (PCE)
#             46 = PPI             9 = Retail Sales
#            180 = Jobless Claims
#           🔑 FRED republishes the BLS calendar, which matters because
#           **bls.gov returns 403 to automated fetch** (tested 2026-07-30 with and
#           without a browser User-Agent — identical 1,323-byte refusal, so it's an
#           IP/datacenter block, not a UA problem). FRED is how we read BLS dates.
#           ⚠️ FRED gives DATES, not times. The 08:30 ET times below are convention.
#
#   Fed   — https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#           Fetches fine. The ONLY source for FOMC decisions + minutes; FRED does
#           not carry them.
#
#   NOT COVERED BY EITHER: ISM (FRED dropped it — redistribution restrictions).
#   ISM stays a job for the playbook's step-2 web sweep. Don't guess it here.
#
# ---------------------------------------------------------------------------
# Last updated: 2026-07-30 (was 2026-07-15).
#   Promoted to verified via the sources above:
#     - FOMC Minutes 2026-08-19            (Fed lists it explicitly)
#     - Employment Situation 2026-10-02, 2026-11-06, 2026-12-04  (FRED id=50;
#       these were first-Friday GUESSES and all three turned out correct)
#     - CPI Aug–Dec independently corroborated by FRED (already verified via mirrors)
#   STILL ESTIMATED — genuinely not published yet, not an oversight:
#     - FOMC Minutes Sep/Oct/Dec 2026 + Feb 2027 — the Fed's own page says "not yet
#       scheduled". The 3wk-post-meeting rule is now validated against 5 confirmed
#       instances, so trust it, but keep the flag.
#     - Employment Situation 2027-01-08 — beyond FRED's published horizon.
#
# RE-VERIFY QUARTERLY → next pass due ~2026-10-30.
#   The quarterly job is now a diff, not a hunt: pull the FRED release IDs above,
#   compare to these dates, promote anything the Fed has newly scheduled, and extend
#   both tiers into the next year. Anything still marked verified:false must be
#   confirmed against its official source before it's trusted.
#
# Times are in America/New_York (ET) — the loader converts to UTC for the gate.
# FOMC rate decisions are at 14:00 ET; FOMC Minutes at 14:00 ET (Wed, 3 weeks post-meeting);
# Employment Situation + CPI at 08:30 ET.

events:
